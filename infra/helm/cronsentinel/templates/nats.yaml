apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ .Release.Name }}-nats, namespace: {{ .Release.Namespace }}}
spec:
  serviceName: {{ .Release.Name }}-nats
  replicas: {{ .Values.nats.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-nats}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-nats}}
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          {{- /* A lone JetStream node configured with peer routes waits forever for a quorum. */}}
          {{- if gt (int .Values.nats.replicas) 1 }}
          {{- $routes := list }}
          {{- range $i := until (int .Values.nats.replicas) }}
          {{- $routes = append $routes (printf "nats://%s-nats-%d.%s-nats:6222" $.Release.Name $i $.Release.Name) }}
          {{- end }}
          args: ["-js", "-sd", "/data", "--cluster_name", "cs", "--cluster", "nats://0.0.0.0:6222", "--routes", {{ join "," $routes | quote }}]
          {{- else }}
          args: ["-js", "-sd", "/data"]
          {{- end }}
          ports: [{containerPort: 4222}, {containerPort: 6222}]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates: [{metadata: {name: data}, spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: {{ .Values.nats.storage }}}}}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-nats, namespace: {{ .Release.Namespace }}}
spec: {clusterIP: None, selector: {app: {{ .Release.Name }}-nats}, ports: [{name: client, port: 4222}, {name: cluster, port: 6222}]}

image: {api: ghcr.io/cronsentinel/api:0.1.0, web: ghcr.io/cronsentinel/web:0.1.0}
domain: cronsentinel.example.com
ingestDomain: ingest.cronsentinel.example.com
ingress:
  className: ""         # e.g. nginx; empty = the cluster's default IngressClass
  annotations: {}       # e.g. cert-manager issuer; copied to the ingest Ingress only when it has its own host
  appLimitRps: 50       # per client IP, app host (UI + API)
  ingestLimitRps: 1000  # per client IP, ingest host: high on purpose (many jobs behind one IP); per-job limits apply in the app
  ingestPathsOnAppHost: false  # with a separate ingestDomain, also serve the ingest paths on the app host (installs that started single-host)
migration:                # used only by the pre-install/pre-upgrade migrate hook, which runs as the DB owner
  databaseUrl: postgresql+psycopg://owner:pass@postgres:5432/cronsentinel
  appDbPassword: pass     # must match the password in env.DATABASE_URL; migration 0007 sets it on jobwatch_app
env:                      # rendered into a Secret; supply real values via --set-file or external-secrets
  DATABASE_URL: postgresql+psycopg://jobwatch_app:pass@postgres:5432/cronsentinel   # app role (migration 0007); RLS applies
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://cronsentinel-nats:4222
  KEYCLOAK_ISSUER: https://auth.example.com/realms/cronsentinel
  KEYCLOAK_CLIENT_ID: cronsentinel-web
  KEYCLOAK_CLIENT_SECRET: ""
  KEYCLOAK_ADMIN_CLIENT_SECRET: ""   # R43: jobwatch-admin service account; empty disables per-org SSO setup
  SECRET_ENCRYPTION_KEY: ""
  API_PUBLIC_URL: https://cronsentinel.example.com
  WEB_PUBLIC_URL: https://cronsentinel.example.com
  INGEST_PUBLIC_URL: ""   # empty = https://<ingestDomain>
  AGENT_DOWNLOAD_BASE: ""   # R62: e.g. https://github.com/<owner>/<repo>/releases/download (deploy.yml sets it)
  AGENT_VERSION: ""         # R62: the release tag holding the agent binaries (deploy.yml sets it to the deployed tag)
  AUTH_SOCIAL_PROVIDERS: ""   # R51: e.g. "google,github,microsoft" once those identity providers exist in the Keycloak realm   # R49: ping URLs the API reports (imports)
  COOKIE_SECURE: "true"
  COPILOT_BASE_URL: http://vllm:8000
  COPILOT_MODEL: Qwen/Qwen2.5-14B-Instruct
  COPILOT_ALLOW_EXTERNAL: "false"   # R16: refuse non-private LLM endpoints unless deliberately set
  # R18 SSRF guard: "false" = tenant webhooks reach public addresses only (multi-tenant SaaS).
  # Set "true" only for a single-tenant install that posts to internal services.
  OUTBOUND_ALLOW_PRIVATE: "false"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
replicas: {api: 2, ingest: 2, ingestMax: 20, web: 2, execProcessor: 2, reconciler: 1, scheduleGenerator: 1, outboundExporter: 1, ruleEngine: 1, notifier: 2, scorer: 1}   # ingest/ingestMax = HPA min/max; size ingestMax to the nodes' CPU
nats: {replicas: 3, storage: 10Gi}   # replicas is install-time only: switching 1 <-> 3 on existing JetStream data needs a fresh volume
resources:
  api: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
  worker: {requests: {cpu: 50m, memory: 192Mi}, limits: {cpu: 500m, memory: 384Mi}}
